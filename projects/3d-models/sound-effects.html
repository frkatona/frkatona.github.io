<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anthony Katona's sound-effects portfolio with interactive waveform previews.">
    <title>Sound Effects Archive | Anthony Katona</title>
    <link rel="icon" type="image/x-icon" href="../../assets/images/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="sound-page">
    <a class="skip-link" href="#sound-effects">Skip to sound effects</a>

    <header class="site-header">
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="index.html">3D Models</a>
            <a class="is-active" href="sound-effects.html" aria-current="page">Sound FX</a>
        </nav>
    </header>

    <main class="page-shell sound-page-shell">
        <section class="soundfx-section" id="sound-effects" aria-labelledby="soundfx-title">
            <header class="soundfx-header">
                <h1 id="soundfx-title">Sound Effects</h1>
            </header>

            <div class="soundfx-toolbar panel">
                <label class="search-control sound-search" for="sound-search">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"></path>
                    </svg>
                    <span class="visually-hidden">Search sound effects</span>
                    <input id="sound-search" type="search" placeholder="Search sound effects" autocomplete="off">
                </label>

                <label class="source-control" for="sound-source-filter">
                    <span class="visually-hidden">Source project</span>
                    <select id="sound-source-filter" aria-label="Source project">
                        <option value="all">All projects</option>
                    </select>
                </label>

                <p class="sound-results" id="sound-results">Loading sound library...</p>
            </div>

            <div class="sound-player-panel panel" id="sound-player-panel">
                <button class="sound-master-play" id="sound-master-play" type="button" aria-label="Play selected sound" disabled>
                    <svg class="sound-play-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"></path></svg>
                    <svg class="sound-pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"></path></svg>
                </button>
                <div class="sound-now-playing">
                    <span>Now playing</span>
                    <strong id="sound-now-playing">Select a sound effect</strong>
                </div>
                <span class="sound-time" id="sound-time">00:00 / 00:00</span>
                <label class="sound-progress-control" for="sound-progress">
                    <span class="visually-hidden">Sound playback position</span>
                    <input id="sound-progress" type="range" min="0" max="1" step="0.001" value="0" disabled>
                </label>
                <label class="sound-volume-control" for="sound-volume">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Zm4.5 3a5.5 5.5 0 0 1 0 8m2.5-11a9.5 9.5 0 0 1 0 14"></path></svg>
                    <span class="visually-hidden">Volume</span>
                    <input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
                    <output id="sound-volume-output" for="sound-volume">80%</output>
                </label>
                <a class="sound-download" id="sound-download" href="#" download hidden>Download</a>
                <audio id="sound-player" preload="metadata"></audio>
            </div>

            <div class="sound-grid" id="sound-grid" aria-live="polite">
                <p class="animation-placeholder">Loading the sound catalog...</p>
            </div>
            <p class="sound-empty" id="sound-empty" hidden>No sound effects match your search.</p>
        </section>
    </main>

    <noscript>
        <p class="noscript-message">JavaScript is required to preview the sound effects.</p>
    </noscript>

    <script type="module" src="sound-effects.js"></script>
</body>

</html>
